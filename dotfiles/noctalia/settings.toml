[osd]
position = "bottom_center"

[plugins]
enabled = [ "noctalia/wallhaven" ]

[shell]
avatar_path = "/home/nate/.config/noctalia/avatars/2b.jpg"
font_family = "JetBrains Mono"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false
    compact = true
    layout = "simple"
    search_position = "top"

    [shell.panel]
    launcher_placement = "attached"
    wallpaper_show_names = false

    [shell.screen_corners]
    enabled = true
    size = 40

    [shell.screenshot]
    confirm_region = true
    remember_last_region = true
    save_to_file = false

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "qt", "umbriel" ]
    community_ids = [ "zen-browser", "discord", "sable", "obsidian", "steam" ]

[wallpaper]
directory = "/home/nate/Wallpapers"
enabled = true
transition_on_startup = true

    [wallpaper.default]
    path = "/home/nate/Wallpapers/made_in_abyss_2.png"

    [wallpaper.last]
    path = "/home/nate/Wallpapers/made_in_abyss_2.png"

    [wallpaper.monitors.DP-1]
    path = "/home/nate/Wallpapers/Kurumi/kurumi_2.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/nate/Wallpapers/made_in_abyss_2.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/nate/Wallpapers/made_in_abyss_2.png"

[widget.audio_visualizer]
color_2 = "on_primary"

[widget.bluetooth]
enabled = false

[widget.clipboard]
enabled = false

[widget.control-center]
glyph = "home"

[widget.tray]
enabled = true

[widget.workspaces]
focused_output_only = true
pill_scale = 0.75
show_labels = false
