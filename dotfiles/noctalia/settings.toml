[bar.default]
capsule = true
end = [ "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "group:g1", "control-center", "session" ]
font_family = "JetBrains Mono"
icon_color = "primary"
start = [ "launcher", "wallpaper", "workspaces", "media", "notifications" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_container"
    id = "g1"
    members = [ "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0
    widget_spacing = 9

[calendar]

[control_center]
hidden_tabs = [ "weather", "screen-time" ]

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "noctalia/wallhaven:shortcut"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
icon_size = 32

[hooks]
wallpaper_changed = "/home/nate/.config/noctalia/scripts/wallpaper.sh"

